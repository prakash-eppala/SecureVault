name: SecureVaultExample
options:
  bundleIdPrefix: com.prakasheppala
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SecureVault:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  SecureVaultExample:
    type: application
    platform: iOS
    sources:
      - SecureVaultExample
    dependencies:
      - package: SecureVault
        product: SecureVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prakasheppala.SecureVaultExample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SecureVault
        INFOPLIST_KEY_NSFaceIDUsageDescription: SecureVault Example uses Face ID to protect the demo PIN and the locked vault screen.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: SecureVaultExample/ObjC/SecureVaultExample-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  SecureVaultExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SecureVaultExampleTests
    dependencies:
      - target: SecureVaultExample
      - package: SecureVault
        product: SecureVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prakasheppala.SecureVaultExampleTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SecureVaultExample.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SecureVaultExample
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SecureVaultExample:
    build:
      targets:
        SecureVaultExample: all
    test:
      targets:
        - SecureVaultExampleTests
